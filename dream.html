<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BedVortex · 梦境深处</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    color: #eef5ff; background:
      radial-gradient(circle at 50% 72%, rgba(37,81,151,.38), transparent 34%),
      radial-gradient(circle at 18% 18%, rgba(47,79,155,.24), transparent 30%),
      linear-gradient(#020715, #06142f 58%, #0a1e42);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .veil { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(transparent 55%, rgba(5,19,45,.26)); }
  header { position: fixed; inset: 22px 26px auto; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; pointer-events: none; }
  h1 { margin: 0; font: 500 clamp(21px,3vw,38px)/1.1 system-ui,sans-serif; letter-spacing: -.04em; }
  h1 span { display: block; margin-top: 7px; color: rgba(211,228,255,.6); font: 11px/1.4 ui-monospace,monospace; letter-spacing: .2em; text-transform: uppercase; }
  .wish { color: rgba(220,234,255,.72); font-size: 12px; letter-spacing: .08em; }
  .hint { position: fixed; z-index: 2; left: 50%; bottom: 28px; transform: translateX(-50%); color: rgba(224,237,255,.7); font-size: 12px; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 12px #000; }
  .back { position: fixed; z-index: 3; left: 26px; bottom: 24px; color: #eaf2ff; text-decoration: none; font-size: 12px; padding: 9px 14px; border: 1px solid rgba(206,225,255,.28); border-radius: 999px; background: rgba(3,10,27,.28); backdrop-filter: blur(9px); }
  .back:hover, .back:focus-visible { background: rgba(91,135,214,.25); border-color: rgba(222,235,255,.65); outline: none; }
  .controls { position: fixed; z-index: 4; right: 24px; bottom: 22px; width: min(270px, calc(100vw - 36px)); padding: 13px 15px 14px; border: 1px solid rgba(196,218,255,.24); border-radius: 16px; background: rgba(3,10,27,.56); box-shadow: 0 12px 42px rgba(0,0,0,.25); backdrop-filter: blur(12px); }
  .control + .control { margin-top: 11px; }
  .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; color: rgba(232,241,255,.82); font-size: 11px; }
  .control output { color: #a9ccff; }
  .control input { display: block; width: 100%; accent-color: #8ebcff; cursor: ew-resize; }
  .arrival { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #020718; animation: arrive 1.8s ease-out forwards; }
  @keyframes arrive { to { opacity: 0; } }
  @media (max-width: 600px) { header { inset: 18px; } .back { left: 18px; bottom: 18px; } .hint { bottom: 145px; } .controls { right: 18px; bottom: 68px; } }
  @media (prefers-reduced-motion: reduce) { .arrival { animation-duration: .3s; } }
</style>
</head>
<body>
<canvas id="stars" aria-label="深蓝色闪烁星空，许多像素小羊在画面中自由跳跃，点击或拖动可以召唤新的小羊"></canvas>
<div class="veil"></div>
<header><h1>梦境深处<span>Beyond the vortex</span></h1><div class="wish">小羊 <span id="sheepTotal">18</span></div></header>
<div class="hint">移动视角 · 点击召唤小羊 · 按住拖动连续产生羊群</div>
<a class="back" href="index.html">← 返回漩涡</a>
<div class="controls" aria-label="小羊参数">
  <div class="control"><label for="speedControl"><span>奔跑速度</span><output id="speedValue">1.6×</output></label><input id="speedControl" type="range" min="0.5" max="3.5" step="0.1" value="1.6"></div>
  <div class="control"><label for="sizeControl"><span>小羊大小</span><output id="sizeValue">1.25×</output></label><input id="sizeControl" type="range" min="0.6" max="2.2" step="0.05" value="1.25"></div>
</div>
<div class="arrival"></div>
<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
const sheepTotal = document.getElementById('sheepTotal');
const speedControl = document.getElementById('speedControl');
const speedValue = document.getElementById('speedValue');
const sizeControl = document.getElementById('sizeControl');
const sizeValue = document.getElementById('sizeValue');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let width = 1, height = 1, dpr = 1, last = performance.now(), nextMeteor = 1.4;
let pointerX = 0, pointerY = 0, targetX = 0, targetY = 0;
let drawingSheep = false, lastSpawnAt = 0, lastSpawnX = 0, lastSpawnY = 0;
let sheepSpeedMultiplier = Number(speedControl.value), sheepSizeMultiplier = Number(sizeControl.value);
const stars = [], meteors = [], flock = [];
const sheepImage = new Image();
sheepImage.src = 'sheep.png';
const initialSheepCount = 18;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight;
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const count = Math.min(520, Math.round(width * height / 3100));
  stars.length = 0;
  for (let i = 0; i < count; i++) stars.push({
    x: Math.random(), y: Math.random(), r: .35 + Math.random() * 1.35,
    alpha: .25 + Math.random() * .7, phase: Math.random() * Math.PI * 2,
    speed: .45 + Math.random() * 1.7, depth: .2 + Math.random() * .8,
    blue: Math.random() < .24
  });
  for (const sheep of flock) {
    sheep.x = Math.max(42, Math.min(width - 42, sheep.x));
    sheep.y = Math.max(54, Math.min(height - 42, sheep.y));
  }
  if (!flock.length) {
    for (let i = 0; i < initialSheepCount; i++) {
      spawnSheep(55 + Math.random() * Math.max(1, width - 110), 80 + Math.random() * Math.max(1, height - 150), true);
    }
  }
}

function spawnMeteor(x = Math.random() * width * .65, y = Math.random() * height * .42) {
  const angle = .42 + Math.random() * .22;
  const speed = 650 + Math.random() * 450;
  meteors.push({ x: x - 120, y: y - 60, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0, max: .72 + Math.random() * .42, length: 90 + Math.random() * 150 });
}

function paintSheep(x, y, scale, facing, frame, alpha = 1, glow = 12) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing * scale, scale);
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(115,174,255,.78)';
  ctx.shadowBlur = glow;
  ctx.drawImage(sheepImage, frame * 40, 0, 40, 32, -20, -16, 40, 32);
  ctx.restore();
}

function spawnSheep(x, y, settled = false) {
  const angle = Math.random() * Math.PI * 2;
  flock.push({
    x, y,
    angle,
    targetAngle: angle,
    speed: 32 + Math.random() * 48,
    turnIn: .25 + Math.random() * 1.4,
    phase: Math.random() * Math.PI * 2,
    hopSpeed: 6.5 + Math.random() * 4.5,
    size: .88 + Math.random() * .3,
    born: performance.now() - (settled ? 1000 : 0)
  });
  if (flock.length > 75) flock.shift();
  sheepTotal.textContent = flock.length;
}

function updateAndDrawSheep(now, dt) {
  if (!sheepImage.complete || !sheepImage.naturalWidth) return;
  for (const sheep of flock) {
    if (!reduced) {
      sheep.turnIn -= dt * sheepSpeedMultiplier;
      if (sheep.turnIn <= 0) {
        sheep.targetAngle += (Math.random() - .5) * 2.8;
        sheep.speed = 32 + Math.random() * 55;
        sheep.turnIn = .3 + Math.random() * 1.65;
      }
      const turn = Math.atan2(Math.sin(sheep.targetAngle - sheep.angle), Math.cos(sheep.targetAngle - sheep.angle));
      sheep.angle += turn * Math.min(1, dt * 2.4 * Math.sqrt(sheepSpeedMultiplier));
      sheep.x += Math.cos(sheep.angle) * sheep.speed * dt * sheepSpeedMultiplier;
      sheep.y += Math.sin(sheep.angle) * sheep.speed * .62 * dt * sheepSpeedMultiplier;
      const marginX = 42, top = 56, bottom = 38;
      if (sheep.x < marginX || sheep.x > width - marginX) {
        sheep.x = Math.max(marginX, Math.min(width - marginX, sheep.x));
        sheep.angle = sheep.targetAngle = Math.PI - sheep.angle + (Math.random() - .5) * .45;
      }
      if (sheep.y < top || sheep.y > height - bottom) {
        sheep.y = Math.max(top, Math.min(height - bottom, sheep.y));
        sheep.angle = sheep.targetAngle = -sheep.angle + (Math.random() - .5) * .45;
      }
    }
  }
  flock.sort((a, b) => a.y - b.y);
  ctx.imageSmoothingEnabled = false;
  for (const sheep of flock) {
    const age = (now - sheep.born) / 1000;
    const appear = Math.min(1, age / .2);
    const pop = 1 + Math.sin(appear * Math.PI) * .3;
    const depth = Math.max(0, Math.min(1, sheep.y / height));
    const hop = reduced ? 0 : Math.abs(Math.sin(age * sheep.hopSpeed * sheepSpeedMultiplier + sheep.phase)) * (12 + depth * 14);
    const responsive = Math.max(.7, Math.min(1.15, Math.min(width / 1100, height / 680)));
    const scale = responsive * sheep.size * sheepSizeMultiplier * (1.65 + depth * .85) * appear * pop;
    const facing = Math.cos(sheep.angle) >= 0 ? 1 : -1;
    const frame = Math.floor(now * .012 * sheepSpeedMultiplier + sheep.phase * 1.8) % 6;
    paintSheep(sheep.x + pointerX * 8 * depth, sheep.y - hop + pointerY * 5 * depth, scale, facing, frame, appear, 9 + depth * 10);
  }
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function draw(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  pointerX += (targetX - pointerX) * (1 - Math.exp(-dt * 2.6));
  pointerY += (targetY - pointerY) * (1 - Math.exp(-dt * 2.6));
  ctx.clearRect(0, 0, width, height);
  for (const s of stars) {
    const twinkle = reduced ? 1 : .62 + .38 * Math.sin(now * .001 * s.speed + s.phase);
    const x = s.x * width + pointerX * s.depth * 18;
    const y = s.y * height + pointerY * s.depth * 12;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.blue ? `rgba(151,199,255,${s.alpha * twinkle})` : `rgba(244,248,255,${s.alpha * twinkle})`;
    ctx.shadowColor = s.blue ? '#77aefc' : '#e9f3ff'; ctx.shadowBlur = s.r > 1.2 ? 8 : 2; ctx.fill();
  }
  ctx.shadowBlur = 0;
  updateAndDrawSheep(now, dt);
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
    const alpha = Math.sin(Math.min(1, m.life / m.max) * Math.PI);
    const lenScale = m.length / Math.hypot(m.vx, m.vy);
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * lenScale, m.y - m.vy * lenScale);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`); grad.addColorStop(.16, `rgba(163,205,255,${alpha * .8})`); grad.addColorStop(1, 'rgba(83,130,216,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * lenScale, m.y - m.vy * lenScale); ctx.stroke();
    if (m.life > m.max) meteors.splice(i, 1);
  }
  if (!reduced) {
    nextMeteor -= dt;
    if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 2.8 + Math.random() * 5.5; }
  }
  requestAnimationFrame(draw);
}

addEventListener('resize', resize);
canvas.addEventListener('pointermove', e => {
  targetX = e.clientX / width - .5;
  targetY = e.clientY / height - .5;
  if (drawingSheep) {
    const distance = Math.hypot(e.clientX - lastSpawnX, e.clientY - lastSpawnY);
    if (distance > 24 || e.timeStamp - lastSpawnAt > 75) {
      spawnSheep(e.clientX, e.clientY);
      lastSpawnX = e.clientX; lastSpawnY = e.clientY; lastSpawnAt = e.timeStamp;
    }
  }
});
canvas.addEventListener('pointerleave', () => { targetX = targetY = 0; drawingSheep = false; });
canvas.addEventListener('pointerdown', e => {
  drawingSheep = true;
  lastSpawnX = e.clientX; lastSpawnY = e.clientY; lastSpawnAt = e.timeStamp;
  canvas.setPointerCapture(e.pointerId);
  spawnSheep(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  drawingSheep = false;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
});
canvas.addEventListener('pointercancel', () => { drawingSheep = false; });
speedControl.addEventListener('input', () => {
  sheepSpeedMultiplier = Number(speedControl.value);
  speedValue.textContent = sheepSpeedMultiplier.toFixed(1) + '×';
});
sizeControl.addEventListener('input', () => {
  sheepSizeMultiplier = Number(sizeControl.value);
  sizeValue.textContent = sheepSizeMultiplier.toFixed(2).replace(/0$/, '') + '×';
});
resize();
if (reduced) { spawnMeteor(width * .32, height * .25); }
requestAnimationFrame(draw);
</script>
</body>
</html>
