<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BedVortex · 梦境深处</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    color: #eef5ff; background: #05070b;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #stars { z-index: 1; cursor: crosshair; touch-action: none; }
  #models { z-index: 2; pointer-events: none; }
  .dream-backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #07101e url("background-stars.png") center/cover no-repeat; }
  .dream-backdrop::before { content: ""; position: absolute; inset: -18%; background: radial-gradient(ellipse at 48% 50%, transparent 0 16%, rgba(59,114,171,.25) 25%, transparent 43%), conic-gradient(from 36deg at 50% 51%, rgba(67,104,211,.3), rgba(169,74,166,.24), rgba(202,116,83,.16), rgba(51,157,147,.24), rgba(67,104,211,.3)); filter: blur(28px) saturate(.65); opacity: .72; transform: scale(1.15) rotate(-8deg); mix-blend-mode: screen; }
  .dream-backdrop::after { content: ""; position: absolute; inset: 0; background: rgba(3,8,18,.26); backdrop-filter: saturate(.45) brightness(.72) contrast(1.08); }
  .tunnel { position: absolute; left: 50%; top: 51%; width: 84vmin; aspect-ratio: 1; transform: translate(-50%,-50%) scaleY(.72) rotate(7deg); border-radius: 50%; background: radial-gradient(circle, rgba(4,8,18,.7) 0 11%, transparent 12% 21%, rgba(139,168,222,.08) 22% 25%, transparent 26% 38%, rgba(198,139,186,.09) 39% 43%, transparent 44% 59%, rgba(92,168,174,.09) 60% 65%, transparent 66%); box-shadow: inset 0 0 90px rgba(87,135,214,.18), 0 0 120px rgba(31,77,139,.2); }
  .veil { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(transparent 55%, rgba(5,19,45,.26)); }
  header { position: fixed; inset: 10px 14px auto; z-index: 4; display: flex; justify-content: flex-end; pointer-events: none; }
  .wish { color: rgba(220,234,255,.72); font-size: 12px; letter-spacing: .08em; }
  .hint { position: fixed; z-index: 4; left: 14px; bottom: 12px; color: rgba(224,237,255,.7); font-size: 12px; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 12px #000; }
  .back { position: fixed; z-index: 4; right: 14px; bottom: 12px; color: #eaf2ff; text-decoration: none; font-size: 12px; padding: 7px 12px; border: 1px solid rgba(206,225,255,.28); border-radius: 8px; background: rgba(20,20,24,.72); backdrop-filter: blur(4px); }
  .back:hover, .back:focus-visible { background: rgba(91,135,214,.25); border-color: rgba(222,235,255,.65); outline: none; }
  .ending { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; text-align: center; background: rgba(2,7,21,.68); backdrop-filter: blur(10px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 1.2s ease, visibility 1.2s; }
  .ending.show { opacity: 1; visibility: visible; pointer-events: auto; }
  .ending-card { max-width: 620px; padding: 34px 30px; }
  .ending h2 { margin: 0 0 14px; font-family: inherit; font-size: clamp(28px,5vw,54px); font-weight: 500; line-height: 1.15; letter-spacing: -.04em; }
  .ending p { margin: 0 auto 27px; color: rgba(222,235,255,.76); font-size: clamp(13px,1.6vw,17px); line-height: 1.8; }
  .ending-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .ending-actions button, .ending-actions a { appearance: none; min-width: 128px; padding: 11px 18px; border: 1px solid rgba(206,225,255,.34); border-radius: 8px; color: #eff6ff; background: rgba(85,129,205,.2); font: 12px ui-monospace,monospace; text-decoration: none; cursor: pointer; }
  .ending-actions button:hover, .ending-actions a:hover { background: rgba(113,158,235,.36); border-color: rgba(230,240,255,.7); }
  .arrival { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #020718; animation: arrive 1.8s ease-out forwards; }
  @keyframes arrive { to { opacity: 0; } }
  @media (max-width: 600px) { .hint { right: 14px; bottom: 52px; white-space: normal; } }
  @media (prefers-reduced-motion: reduce) { .arrival { animation-duration: .3s; } }
</style>
</head>
<body>
<div class="dream-backdrop"><div class="tunnel"></div></div>
<canvas id="stars" aria-label="低饱和彩色星空中，立体小羊自由跳跃，困意达到百分之八十后变成立体水饺"></canvas>
<canvas id="models" aria-hidden="true"></canvas>
<div class="veil"></div>
<header><div class="wish">困意 <span id="sleepiness">0%</span></div></header>
<div class="hint" id="hint">点击或拖动召唤小羊 · 困意 80% 后会发生变化</div>
<a class="back" href="index.html">← 返回漩涡</a>
<div class="arrival"></div>
<div class="ending" id="ending" aria-hidden="true">
  <div class="ending-card">
    <h2>中文的梦，要数水饺。</h2>
    <p>Sheep 和 sleep 很像，睡觉和水饺也很像。<br>数着数着，你已经坠入最深的梦。</p>
    <div class="ending-actions"><button id="dreamAgain" type="button">再做一个梦</button><a href="index.html">醒来</a></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
const modelCanvas = document.getElementById('models');
const sleepiness = document.getElementById('sleepiness');
const hint = document.getElementById('hint');
const ending = document.getElementById('ending');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let width = 1, height = 1, dpr = 1, last = performance.now(), nextMeteor = 1.4;
let pointerX = 0, pointerY = 0, targetX = 0, targetY = 0;
let drawingSheep = false, lastSpawnAt = 0, lastSpawnX = 0, lastSpawnY = 0;
let summonedCount = 0, dumplingStartedAt = 0, endingStartedAt = 0, endingShown = false;
const movementSpeedMultiplier = 2.4;
const animationSpeedMultiplier = 1.6;
const sheepSizeMultiplier = 2;
const sheepGoal = 24;
const stars = [], meteors = [], flock = [];
const initialSheepCount = 18;

const modelRenderer = new THREE.WebGLRenderer({ canvas: modelCanvas, alpha: true, antialias: true });
modelRenderer.setClearColor(0x000000, 0);
modelRenderer.outputColorSpace = THREE.SRGBColorSpace;
modelRenderer.toneMapping = THREE.ACESFilmicToneMapping;
modelRenderer.toneMappingExposure = 1.15;
const modelScene = new THREE.Scene();
const modelCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 300);
modelCamera.position.set(0, 0, 100);
modelScene.add(new THREE.HemisphereLight(0xddeaff, 0x24304d, 1.7));
const modelKey = new THREE.DirectionalLight(0xfff5df, 2.5);
modelKey.position.set(-3, 5, 8);
modelScene.add(modelKey);
const modelRim = new THREE.DirectionalLight(0x849dff, 2.2);
modelRim.position.set(5, 1, 5);
modelScene.add(modelRim);
const sphereGeometry = new THREE.SphereGeometry(1, 18, 12);
const legGeometry = new THREE.CylinderGeometry(.1, .12, 1, 10);
const dumplingShape = new THREE.Shape();
dumplingShape.moveTo(-1, -.2);
dumplingShape.bezierCurveTo(-.88, .65, .88, .65, 1, -.2);
dumplingShape.bezierCurveTo(.62, -.72, -.62, -.72, -1, -.2);
const dumplingGeometry = new THREE.ExtrudeGeometry(dumplingShape, { depth: .42, bevelEnabled: true, bevelThickness: .09, bevelSize: .08, bevelSegments: 3, curveSegments: 18 });
dumplingGeometry.center();

function modelMaterial(color, roughness = .85, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, transparent: true, side: THREE.DoubleSide });
}

function addScaledSphere(parent, material, position, scale) {
  const mesh = new THREE.Mesh(sphereGeometry, material);
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  parent.add(mesh);
  return mesh;
}

function createCreatureModel() {
  const root = new THREE.Group();
  const sheep = new THREE.Group();
  const dumpling = new THREE.Group();
  const legs = [];
  const wool = modelMaterial(0xf4f0e8, .96);
  const woolShade = modelMaterial(0xd6d9e2, .94);
  const face = modelMaterial(0x525866, .88);
  const dark = modelMaterial(0x171b24, .78);
  const cream = modelMaterial(0xfff1d6, .9);
  const creamShade = modelMaterial(0xdccbb1, .93);
  addScaledSphere(sheep, wool, [0, .08, 0], [.86, .57, .55]);
  for (const tuft of [[-.48,.35,.08],[0,.48,.06],[.46,.34,.06]]) {
    addScaledSphere(sheep, woolShade, tuft, [.34, .29, .3]);
  }
  addScaledSphere(sheep, face, [.82, .08, .04], [.38, .34, .36]);
  addScaledSphere(sheep, face, [1.04, -.02, .06], [.25, .2, .26]);
  addScaledSphere(sheep, face, [.72, .37, .12], [.12, .24, .12]).rotation.z = -.65;
  addScaledSphere(sheep, face, [.72, .37, -.12], [.12, .24, .12]).rotation.z = -.65;
  addScaledSphere(sheep, dark, [1.03, .14, .3], [.055, .065, .04]);
  addScaledSphere(sheep, dark, [1.03, .14, -.3], [.055, .065, .04]);
  addScaledSphere(sheep, wool, [-.88, .17, 0], [.22, .22, .22]);
  for (const [x, z] of [[-.48,.27],[.43,.27],[-.48,-.27],[.43,-.27]]) {
    const leg = new THREE.Mesh(legGeometry, dark);
    leg.position.set(x, -.57, z);
    leg.scale.set(.7, .52, .7);
    sheep.add(leg);
    legs.push(leg);
  }
  const dumplingBody = new THREE.Mesh(dumplingGeometry, cream);
  dumplingBody.rotation.x = -.12;
  dumpling.add(dumplingBody);
  for (let i = -2; i <= 2; i++) {
    const x = i * .28;
    addScaledSphere(dumpling, creamShade, [x, .34 - Math.abs(i) * .045, .3], [.12, .24, .11]).rotation.z = i * -.08;
  }
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(dumplingGeometry, 28), new THREE.LineBasicMaterial({ color: 0x51483f, transparent: true, opacity: .55 }));
  edge.rotation.x = -.12;
  dumpling.add(edge);
  root.add(sheep, dumpling);
  root.userData = { sheep, dumpling, legs, sheepMaterials: [wool, woolShade, face, dark], dumplingMaterials: [cream, creamShade, edge.material] };
  modelScene.add(root);
  return root;
}

function setModelOpacity(group, materials, alpha) {
  group.visible = alpha > .01;
  for (const material of materials) {
    material.opacity = alpha;
    material.depthWrite = alpha > .98;
  }
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight;
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  modelRenderer.setPixelRatio(dpr);
  modelRenderer.setSize(width, height, false);
  modelCamera.left = -width / 2; modelCamera.right = width / 2;
  modelCamera.top = height / 2; modelCamera.bottom = -height / 2;
  modelCamera.updateProjectionMatrix();
  const count = Math.min(520, Math.round(width * height / 3100));
  stars.length = 0;
  for (let i = 0; i < count; i++) stars.push({
    x: Math.random(), y: Math.random(), r: .35 + Math.random() * 1.35,
    alpha: .25 + Math.random() * .7, phase: Math.random() * Math.PI * 2,
    speed: .45 + Math.random() * 1.7, depth: .2 + Math.random() * .8,
    blue: Math.random() < .24
  });
  for (const sheep of flock) {
    sheep.x = Math.max(42, Math.min(width - 42, sheep.x));
    sheep.y = Math.max(54, Math.min(height - 42, sheep.y));
  }
  if (!flock.length) {
    for (let i = 0; i < initialSheepCount; i++) {
      spawnSheep(55 + Math.random() * Math.max(1, width - 110), 80 + Math.random() * Math.max(1, height - 150), true);
    }
  }
}

function spawnMeteor(x = Math.random() * width * .65, y = Math.random() * height * .42) {
  const angle = .42 + Math.random() * .22;
  const speed = 650 + Math.random() * 450;
  meteors.push({ x: x - 120, y: y - 60, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0, max: .72 + Math.random() * .42, length: 90 + Math.random() * 150 });
}

function vortexWarpPoint(x, y, now, strength = 1) {
  const centerX = width * .5 + pointerX * 10;
  const centerY = height * .52 + pointerY * 7;
  const nx = (x - centerX) / Math.max(width, 1);
  const ny = (y - centerY) / Math.max(height, 1);
  const radius2 = nx * nx + ny * ny;
  const radius = Math.sqrt(radius2);
  const time = reduced ? 0 : now / 1000;
  const phase = time * 2.2 + radius2 * 18;
  const waveX = Math.cos(phase - 2.094395) * width * .018 * strength;
  const waveY = -Math.cos(phase - 4.18879) * height * .018 * strength;
  const warpedX = x + waveX;
  const warpedY = y + waveY;
  const dx = warpedX - centerX;
  const dy = (warpedY - centerY) * 1.18;
  const angle = Math.atan2(dy, dx);
  const distance = Math.hypot(dx, dy);
  const falloff = Math.exp(-radius * 3.2);
  const twist = (falloff * .72 + Math.sin(phase) * .045) * strength + time * .025 * falloff * strength;
  const pulse = 1 + Math.sin(time * 1.7 + distance * .026) * .012 * strength;
  return {
    x: centerX + Math.cos(angle + twist) * distance * pulse,
    y: centerY + Math.sin(angle + twist) * distance * pulse / 1.18
  };
}

function beginDumplingPhase() {
  if (dumplingStartedAt) return;
  dumplingStartedAt = performance.now();
  drawingSheep = false;
  sleepiness.textContent = '80%';
  hint.textContent = '羊群正在变成水饺…';
  spawnMeteor(width * .2, height * .16);
}

function completeDream() {
  if (endingStartedAt) return;
  endingStartedAt = performance.now();
  drawingSheep = false;
  sleepiness.textContent = '100%';
  hint.textContent = '水饺也睡着了…';
  spawnMeteor(width * .16, height * .12);
}

function spawnSheep(x, y, settled = false) {
  if (!settled && endingStartedAt) return;
  if (!settled && dumplingStartedAt) {
    if (performance.now() - dumplingStartedAt >= 1100) completeDream();
    return;
  }
  const angle = Math.random() * Math.PI * 2;
  flock.push({
    x, y,
    angle,
    targetAngle: angle,
    speed: 32 + Math.random() * 48,
    turnIn: .25 + Math.random() * 1.4,
    phase: Math.random() * Math.PI * 2,
    hopSpeed: 6.5 + Math.random() * 4.5,
    size: .88 + Math.random() * .3,
    hatching: !settled,
    model: createCreatureModel(),
    born: performance.now() - (settled ? 1000 : 0)
  });
  if (flock.length > 75) {
    const removed = flock.shift();
    modelScene.remove(removed.model);
  }
  if (!settled) {
    summonedCount++;
    sleepiness.textContent = Math.min(80, Math.round(summonedCount / sheepGoal * 80)) + '%';
    if (summonedCount >= sheepGoal) beginDumplingPhase();
  }
}

function updateAndDrawSheep(now, dt) {
  const dumplingProgress = dumplingStartedAt ? Math.min(1, (now - dumplingStartedAt) / 1100) : 0;
  const endingProgress = endingStartedAt ? Math.min(1, (now - endingStartedAt) / 2600) : 0;
  if (dumplingProgress === 1 && !endingStartedAt) hint.textContent = '困意 80% · 再点击一次进入水饺梦';
  const worldSpeed = movementSpeedMultiplier * (1 - endingProgress * .2);
  for (const sheep of flock) {
    if (!reduced) {
      sheep.turnIn -= dt * worldSpeed;
      if (sheep.turnIn <= 0) {
        sheep.targetAngle += (Math.random() - .5) * 2.8;
        sheep.speed = 32 + Math.random() * 55;
        sheep.turnIn = .3 + Math.random() * 1.65;
      }
      const turn = Math.atan2(Math.sin(sheep.targetAngle - sheep.angle), Math.cos(sheep.targetAngle - sheep.angle));
      sheep.angle += turn * Math.min(1, dt * 2.4 * Math.sqrt(worldSpeed));
      sheep.x += Math.cos(sheep.angle) * sheep.speed * dt * worldSpeed;
      sheep.y += Math.sin(sheep.angle) * sheep.speed * .62 * dt * worldSpeed;
      const marginX = 42, top = 56, bottom = 38;
      if (sheep.x < marginX || sheep.x > width - marginX) {
        sheep.x = Math.max(marginX, Math.min(width - marginX, sheep.x));
        sheep.angle = sheep.targetAngle = Math.PI - sheep.angle + (Math.random() - .5) * .45;
      }
      if (sheep.y < top || sheep.y > height - bottom) {
        sheep.y = Math.max(top, Math.min(height - bottom, sheep.y));
        sheep.angle = sheep.targetAngle = -sheep.angle + (Math.random() - .5) * .45;
      }
    }
  }
  flock.sort((a, b) => a.y - b.y);
  for (const sheep of flock) {
    const age = (now - sheep.born) / 1000;
    const appear = Math.min(1, age / .2);
    const pop = 1 + Math.sin(appear * Math.PI) * .3;
    const depth = Math.max(0, Math.min(1, sheep.y / height));
    const hop = reduced ? 0 : Math.abs(Math.sin(age * sheep.hopSpeed * animationSpeedMultiplier + sheep.phase)) * (12 + depth * 14) * (1 - endingProgress * .2);
    const responsive = Math.max(.7, Math.min(1.15, Math.min(width / 1100, height / 680)));
    const scale = responsive * sheep.size * sheepSizeMultiplier * (1.65 + depth * .85) * appear * pop;
    const facing = Math.cos(sheep.angle) >= 0 ? 1 : -1;
    const drawX = sheep.x + pointerX * 8 * depth;
    const drawY = sheep.y - hop + pointerY * 5 * depth;
    const spawnProgress = sheep.hatching ? Math.min(1, age / .48) : 1;
    const spawnBounce = sheep.hatching && spawnProgress < 1 ? Math.sin(spawnProgress * Math.PI) * 30 : 0;
    const sheepPoint = vortexWarpPoint(drawX, drawY - spawnBounce, now, .22);
    const dumplingBounce = Math.abs(Math.sin(age * sheep.hopSpeed * animationSpeedMultiplier + sheep.phase)) * (10 + depth * 12);
    const dumplingPoint = vortexWarpPoint(drawX, sheep.y - dumplingBounce + pointerY * 5 * depth, now, .22);
    const model = sheep.model;
    model.position.set(
      THREE.MathUtils.lerp(sheepPoint.x, dumplingPoint.x, dumplingProgress) - width / 2,
      height / 2 - THREE.MathUtils.lerp(sheepPoint.y, dumplingPoint.y, dumplingProgress),
      depth * 8
    );
    const modelScale = scale * 22;
    model.scale.setScalar(modelScale);
    model.rotation.y = facing < 0 ? Math.PI : 0;
    model.rotation.z = Math.sin(age * sheep.hopSpeed + sheep.phase) * .035;
    setModelOpacity(model.userData.sheep, model.userData.sheepMaterials, appear * (1 - dumplingProgress));
    setModelOpacity(model.userData.dumpling, model.userData.dumplingMaterials, appear * dumplingProgress);
    model.userData.legs.forEach((leg, index) => {
      leg.rotation.z = Math.sin(age * sheep.hopSpeed * animationSpeedMultiplier + sheep.phase + index * Math.PI) * .32;
    });
  }
}

function draw(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  pointerX += (targetX - pointerX) * (1 - Math.exp(-dt * 2.6));
  pointerY += (targetY - pointerY) * (1 - Math.exp(-dt * 2.6));
  ctx.clearRect(0, 0, width, height);
  for (const s of stars) {
    const twinkle = reduced ? 1 : .62 + .38 * Math.sin(now * .001 * s.speed + s.phase);
    const baseX = s.x * width + pointerX * s.depth * 18;
    const baseY = s.y * height + pointerY * s.depth * 12;
    const warped = vortexWarpPoint(baseX, baseY, now, .72 + s.depth * .28);
    ctx.beginPath(); ctx.arc(warped.x, warped.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.blue ? `rgba(151,199,255,${s.alpha * twinkle})` : `rgba(244,248,255,${s.alpha * twinkle})`;
    ctx.shadowColor = s.blue ? '#77aefc' : '#e9f3ff'; ctx.shadowBlur = s.r > 1.2 ? 8 : 2; ctx.fill();
  }
  ctx.shadowBlur = 0;
  updateAndDrawSheep(now, dt);
  if (endingStartedAt && !endingShown && now - endingStartedAt > 2400) {
    endingShown = true;
    ending.classList.add('show');
    ending.setAttribute('aria-hidden', 'false');
    hint.textContent = '';
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
    const alpha = Math.sin(Math.min(1, m.life / m.max) * Math.PI);
    const lenScale = m.length / Math.hypot(m.vx, m.vy);
    const head = vortexWarpPoint(m.x, m.y, now, .72);
    const tail = vortexWarpPoint(m.x - m.vx * lenScale, m.y - m.vy * lenScale, now, .72);
    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`); grad.addColorStop(.16, `rgba(163,205,255,${alpha * .8})`); grad.addColorStop(1, 'rgba(83,130,216,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(head.x, head.y); ctx.lineTo(tail.x, tail.y); ctx.stroke();
    if (m.life > m.max) meteors.splice(i, 1);
  }
  if (!reduced) {
    nextMeteor -= dt;
    if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 2.8 + Math.random() * 5.5; }
  }
  modelRenderer.render(modelScene, modelCamera);
  requestAnimationFrame(draw);
}

addEventListener('resize', resize);
canvas.addEventListener('pointermove', e => {
  targetX = e.clientX / width - .5;
  targetY = e.clientY / height - .5;
  if (drawingSheep) {
    const distance = Math.hypot(e.clientX - lastSpawnX, e.clientY - lastSpawnY);
    if (distance > 24 || e.timeStamp - lastSpawnAt > 75) {
      spawnSheep(e.clientX, e.clientY);
      lastSpawnX = e.clientX; lastSpawnY = e.clientY; lastSpawnAt = e.timeStamp;
    }
  }
});
canvas.addEventListener('pointerleave', () => { targetX = targetY = 0; drawingSheep = false; });
canvas.addEventListener('pointerdown', e => {
  if (endingStartedAt) return;
  if (dumplingStartedAt) {
    if (performance.now() - dumplingStartedAt >= 1100) completeDream();
    return;
  }
  drawingSheep = true;
  lastSpawnX = e.clientX; lastSpawnY = e.clientY; lastSpawnAt = e.timeStamp;
  canvas.setPointerCapture(e.pointerId);
  spawnSheep(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  drawingSheep = false;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
});
